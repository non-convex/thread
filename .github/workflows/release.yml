name: Release standalone binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: bun-windows-x64
            binary: thread.exe
            archive: thread-windows-x64.zip
          - runner: windows-11-arm
            target: bun-windows-arm64
            binary: thread.exe
            archive: thread-windows-arm64.zip
          - runner: ubuntu-24.04
            target: bun-linux-x64
            binary: thread
            archive: thread-linux-x64.tar.gz
          - runner: ubuntu-24.04-arm
            target: bun-linux-arm64
            binary: thread
            archive: thread-linux-arm64.tar.gz
          - runner: macos-15-intel
            target: bun-darwin-x64
            binary: thread
            archive: thread-macos-x64.tar.gz
          - runner: macos-15
            target: bun-darwin-arm64
            binary: thread
            archive: thread-macos-arm64.tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test test --timeout 30000
      - uses: actions/cache@v4
        with:
          path: ~/.thread/models
          key: recall-e5-q8-761b726-${{ runner.os }}-${{ runner.arch }}
      - name: Verify local semantic recall
        run: bun run test:recall
      - name: Compile standalone binary
        run: bun run build:standalone -- --target ${{ matrix.target }} --outfile release/${{ matrix.binary }}
      - name: Smoke-test Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "release/${{ matrix.binary }}" --help'
      - name: Smoke-test Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "release/${{ matrix.binary }}"
          "release/${{ matrix.binary }}" --help
      - name: Verify standalone recall without node_modules
        run: bun run test:standalone-recall release/${{ matrix.binary }}
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath "release/${{ matrix.binary }}" -DestinationPath "release/${{ matrix.archive }}"
      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "release/${{ matrix.binary }}"
          tar -czf "release/${{ matrix.archive }}" -C release "${{ matrix.binary }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: release/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create or update GitHub release
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" release/* --clobber
